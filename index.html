<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واژه‌نامه تاتی</title>
</head>
<body>
    <h1>تست اتصال دیکشنری</h1>
    <div id="status">در حال بررسی فایل دیتا...</div>
    <ul id="list"></ul>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = 'فایل دیتا با موفقیت خوانده شد:';
                const list = document.getElementById('list');
                data.forEach(item => {
                    let li = document.createElement('li');
                    li.innerText = item.tati + " : " + item.farsi;
                    list.appendChild(li);
                });
            })
            .catch(err => {
                document.getElementById('status').innerText = 'خطا در خواندن فایل دیتا!';
                console.error(err);
            });
    </script>
</body>
</html>
