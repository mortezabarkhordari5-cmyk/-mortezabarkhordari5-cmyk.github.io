<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمت پلاس - پلتفرم هوشمند خدمات منزل</title>
    <!-- Google Fonts Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Persian Datepicker -->
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: var(--shadow);
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 1.5rem auto;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .search-container i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.2rem;
        }

        .container {
            max-width: 1200px;
            margin: -30px auto 40px auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .stats-strip {
            background: white;
            border-radius: var(--radius);
            padding: 1.2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            text-align: center;
        }

        .stat-item h3 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-item p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .category-card {
            background: white;
            border-radius: var(--radius);
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.15);
        }

        .category-card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .category-card h4 {
            font-size: 1rem;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body>

    <header>
        <h1>خدمت پلاس</h1>
        <p>رزرو آنلاین سریع، مطمئن و تخصصی‌ترین خدمات منزل و تأسیسات</p>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="دنبال چه خدمتی هستید؟ (مثل لوله‌کشی، نظافت...)" oninput="handleSearch(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Trust & Stats Strip -->
        <div class="stats-strip">
            <div class="stat-item">
                <h3>+۵,۰۰۰</h3>
                <p>سفارش موفق</p>
            </div>
            <div class="stat-item">
                <h3>۱۰۰٪</h3>
                <p>متخصصان احراز هویت شده</p>
            </div>
            <div class="stat-item">
                <h3>۲۴/۷</h3>
                <p>پشتیبانی و ضمانت کیفیت</p>
            </div>
        </div>

        <!-- Main Categories Section -->
        <div id="categorySection">
            <h2 class="section-title"><i class="fa-solid fa-list-check" style="color: var(--primary);"></i> دسته‌بندی خدمات</h2>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Categories dynamically generated or static -->
                <div class="category-card" onclick="selectCategory('cleaning')">
                    <i class="fa-solid fa-broom"></i>
                    <h4>نظافت و پذیرایی</h4>
                </div>
                <div class="category-card" onclick="selectCategory('plumbing')">
                    <i class="fa-solid fa-faucet-drip"></i>
                    <h4>لوله‌کشی و تأسیسات</h4>
                </div>
                <div class="category-card" onclick="selectCategory('cooling_heating')">
                    <i class="fa-solid fa-temperature-arrow-up"></i>
                    <h4>سرمایش و گرمایش</h4>
                </div>
                <div class="category-card" onclick="selectCategory('appliances')">
                    <i class="fa-solid fa-blender"></i>
                    <h4>تعمیر لوازم خانگی</h4>
                </div>
                <div class="category-card" onclick="selectCategory('electrical')">
                    <i class="fa-solid fa-bolt"></i>
                    <h4>برق‌کاری و سیم‌کشی</h4>
                </div>
                <div class="category-card" onclick="selectCategory('building')">
                    <i class="fa-solid fa-hammer"></i>
                    <h4>بازسازی و ساخت</h4>
                </div>
            </div>
        </div>

        <!-- Subservice / Booking Form Dynamic Container -->
        <div id="dynamicContainer" class="card hidden animate-fade">
            <!-- Dynamic content loads here -->
        </div>
    </div>

    <script>
        // Supabase Configuration (Preserved)
        const SUPABASE_URL = 'https://toegqqofbotxmgycgnfd.supabase.co';
        // Note: Make sure your anon key is active if performing backend queries
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 
        // const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function handleSearch(query) {
            console.log("Searching for:", query);
            // Live filtering implementation can be added here
        }

        function selectCategory(categoryKey) {
            const container = document.getElementById('dynamicContainer');
            container.classList.remove('hidden');
            
            let htmlContent = `<h3 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-circle-chevron-left"></i> انتخاب خدمت در بخش ${categoryKey}</h3>`;
            htmlContent += `<button class="btn" onclick="resetView()" style="background: var(--gray); margin-bottom: 1rem;"><i class="fa-solid fa-arrow-right"></i> بازگشت به دسته‌ها</button>`;
            
            // Sample subservice view
            htmlContent += `
                <div class="form-group">
                    <label>توضیحات سفارش خود را وارد کنید:</label>
                    <textarea class="form-control" rows="4" placeholder="جزئیات درخواست خود را بنویسید..."></textarea>
                </div>
                <button class="btn" onclick="submitOrder()"><i class="fa-solid fa-check"></i> ثبت نهایی سفارش</button>
            `;
            
            container.innerHTML = htmlContent;
            window.scrollTo({ top: container.offsetTop - 50, behavior: 'smooth' });
        }

        function resetView() {
            document.getElementById('dynamicContainer').classList.add('hidden');
        }

        function submitOrder() {
            alert('سفارش شما با موفقیت ثبت شد!');
            resetView();
        }
    </script>
</body>
</html>
