<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمت پلاس - پلتفرم جامع خدمات هوشمند در منزل</title>
    <!-- Tailwind CSS v3 (Stable) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-hands-holding-child"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-gray-800 leading-tight">خدمت پلاس</h1>
                    <span class="text-xs text-indigo-600 font-medium">نسخه پیشرفته هوشمند</span>
                </div>
            </div>
            <button onclick="switchTab('orders')" class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rectangle-list"></i> پیگیری سفارش‌ها
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 py-6 flex-grow w-full pb-20">
        
        <!-- TAB 1: SERVICES & BOOKING -->
        <div id="tab-services" class="space-y-6">
            
            <!-- Banner -->
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-xl font-bold mb-1">چه خدماتی نیاز دارید؟</h2>
                    <p class="text-indigo-100 text-sm">سریع‌ترین راه دسترسی به بهترین متخصصان و استادکاران</p>
                </div>
                <div class="absolute -left-6 -bottom-6 text-white/10 text-8xl opacity-20">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
            </div>

            <!-- Categories Section -->
            <div>
                <h3 class="font-bold text-gray-800 mb-3 text-base">دسته‌بندی خدمات</h3>
                <div id="categories-grid" class="grid grid-cols-3 gap-3"></div>
            </div>

            <!-- Booking Section -->
            <div id="booking-section" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 id="selected-cat-title" class="font-bold text-indigo-600 text-base">انتخاب زیرخدمت</h3>
                    <button onclick="closeBooking()" class="text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div id="subservices-list" class="space-y-2"></div>

                <!-- Service Details Form -->
                <div id="order-form-details" class="hidden space-y-4 pt-3 border-t">
                    <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-gray-500 block">خدمت انتخابی:</span>
                            <span id="summary-service-name" class="font-bold text-gray-800 text-sm"></span>
                        </div>
                        <div class="text-left">
                            <span class="text-xs text-gray-500 block">نوع محاسبه:</span>
                            <span id="summary-calc-type" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded font-medium"></span>
                        </div>
                    </div>

                    <!-- Dynamic Extra Options -->
                    <div id="extra-options-container" class="space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-200"></div>

                    <!-- Persian Date & Time Picker -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">تاریخ انجام کار (شمسی)</label>
                            <input type="text" id="order-date" value="1405/08/15" placeholder="1405/08/15" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-center font-bold text-indigo-700" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">ساعت حضور</label>
                            <select id="order-time" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                                <option value="8 تا 12 صبح">۸ تا ۱۲ صبح</option>
                                <option value="12 تا 16 عصر">۱۲ تا ۱۶ عصر</option>
                                <option value="16 تا 20 شب">۱۶ تا ۲۰ شب</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">شماره تماس همراه</label>
                        <input type="tel" id="order-phone" placeholder="مثال: 09123456789" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-left" dir="ltr">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">آدرس دقیق محل</label>
                        <textarea id="order-address" rows="2" placeholder="شهر، خیابان، کوچه، پلاک، واحد..." class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <div>
                            <span class="text-xs text-gray-500 block">مبلغ نهایی قابل پرداخت:</span>
                            <span id="estimated-price" class="font-extrabold text-indigo-600 text-lg">۰ تومان</span>
                        </div>
                        <button onclick="submitOrder()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-indigo-700 transition">
                            ثبت نهایی سفارش <i class="fa-solid fa-check ml-1"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- TAB 2: ORDERS TRACKING -->
        <div id="tab-orders" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-lg">سفارش‌های ثبت‌شده شما</h3>
                <button onclick="switchTab('services')" class="text-indigo-600 text-sm font-medium"><i class="fa-solid fa-plus ml-1"></i>ثبت سفارش جدید</button>
            </div>
            <div id="orders-list-container" class="space-y-3"></div>
        </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bg-white border-t fixed bottom-0 left-0 right-0 z-40 shadow-lg">
        <div class="max-w-3xl mx-auto flex justify-around py-3">
            <button onclick="switchTab('services')" id="nav-btn-services" class="flex flex-col items-center text-indigo-600 text-xs font-bold gap-1">
                <i class="fa-solid fa-house text-lg"></i>
                خانه و خدمات
            </button>
            <button onclick="switchTab('orders')" id="nav-btn-orders" class="flex flex-col items-center text-gray-400 text-xs font-medium gap-1">
                <i class="fa-solid fa-clipboard-list text-lg"></i>
                پیگیری سفارش‌ها
            </button>
        </div>
    </nav>

    <!-- Application Logic -->
    <script>
        const SUPABASE_URL = 'https://toegqqofbotxmgycgnfd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_783d7bae...'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const categoriesData = [
            {
                id: 'cleaning',
                title: 'نظافت و پذیرایی',
                icon: 'fa-broom',
                color: 'bg-amber-50 text-amber-600',
                subservices: [
                    { name: 'نظافت راه پله و مشاعات', type: 'کنتراتی / پروژه‌ای', basePrice: 250000, hasStairDetails: true },
                    { name: 'نظافت منزل و آپارتمان', type: 'ساعتی', basePrice: 150000, hasHomeDetails: true },
                    { name: 'مبل‌شویی و قالیشویی در منزل', type: 'پروژه‌ای', basePrice: 400000 }
                ]
            },
            {
                id: 'plumbing',
                title: 'تأسیسات و لوله‌کشی',
                icon: 'fa-faucet-dripping',
                color: 'bg-blue-50 text-blue-600',
                subservices: [
                    { name: 'لوله‌کشی آب و فاضلاب', type: 'ساعتی / کنتراتی', basePrice: 300000 },
                    { name: 'رفع گرفتگی لوله و چاه‌بازکنی', type: 'کنتراتی', basePrice: 250000 },
                    { name: 'نصب و تعمیر شیرآلات', type: 'کنتراتی', basePrice: 200000 }
                ]
            },
            {
                id: 'cooling_heating',
                title: 'سرمایش و گرمایش',
                icon: 'fa-temperature-arrow-up',
                color: 'bg-cyan-50 text-cyan-600',
                subservices: [
                    { name: 'سرویس و تعمیر پکیج و آبگرمکن', type: 'کنتراتی', basePrice: 350000 },
                    { name: 'نصب و تعمیر کولر گازی و آبی', type: 'کنتراتی', basePrice: 400000 }
                ]
            },
            {
                id: 'appliances',
                title: 'لوازم خانگی',
                icon: 'fa-tv',
                color: 'bg-purple-50 text-purple-600',
                subservices: [
                    { name: 'تعمیر ماشین لباسشویی و ظرفشویی', type: 'کنتراتی', basePrice: 350000 },
                    { name: 'تعمیر یخچال و فریزر در محل', type: 'کنتراتی', basePrice: 450000 }
                ]
            },
            {
                id: 'electrical',
                title: 'برق‌کاری و روشنایی',
                icon: 'fa-bolt',
                color: 'bg-yellow-50 text-yellow-600',
                subservices: [
                    { name: 'سیم‌کشی و رفع اتصالی برق', type: 'ساعتی', basePrice: 250000 },
                    { name: 'نصب لوستر، هالوژن و آویز', type: 'کنتراتی (تعداد)', basePrice: 200000 }
                ]
            },
            {
                id: 'building',
                title: 'بازسازی و دکوراسیون',
                icon: 'fa-paint-roller',
                color: 'bg-rose-50 text-rose-600',
                subservices: [
                    { name: 'نقاشی ساختمان و کاغذ دیواری', type: 'متراژی', basePrice: 500000 },
                    { name: 'گچ‌کاری، کاشی‌کاری و بنایی', type: 'کنتراتی', basePrice: 600000 }
                ]
            }
        ];

        let currentSelectedService = null;

        window.onload = function() {
            renderCategories();
        };

        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = categoriesData.map(cat => `
                <button onclick="selectCategory('${cat.id}')" class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col items-center text-center gap-2 group">
                    <div class="w-12 h-12 rounded-xl ${cat.color} flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="fa-solid ${cat.icon}"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">${cat.title}</span>
                </button>
            `).join('');
        }

        function selectCategory(catId) {
            const cat = categoriesData.find(c => c.id === catId);
            if (!cat) return;

            document.getElementById('selected-cat-title').innerText = cat.title;
            const subList = document.getElementById('subservices-list');
            
            subList.innerHTML = cat.subservices.map((sub) => `
                <div onclick='selectSubservice(${JSON.stringify(sub)})' class="p-3 bg-gray-50 hover:bg-indigo-50/50 border border-gray-200 rounded-xl cursor-pointer transition flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm">${sub.name}</h4>
                        <span class="text-xs text-indigo-600 font-medium">محاسبه: ${sub.type}</span>
                    </div>
                    <div class="text-left">
                        <span class="text-xs text-indigo-600 font-bold block">پایه: ${sub.basePrice.toLocaleString()} ت</span>
                        <i class="fa-solid fa-chevron-left text-xs text-gray-400 mt-1"></i>
                    </div>
                </div>
            `).join('');

            document.getElementById('booking-section').classList.remove('hidden');
            document.getElementById('order-form-details').classList.add('hidden');
            document.getElementById('booking-section').scrollIntoView({ behavior: 'smooth' });
        }

        function selectSubservice(sub) {
            currentSelectedService = sub;
            document.getElementById('summary-service-name').innerText = sub.name;
            document.getElementById('summary-calc-type').innerText = sub.type;

            const extraContainer = document.getElementById('extra-options-container');
            if (sub.hasStairDetails) {
                extraContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">تعداد طبقات راه پله</label>
                            <input type="number" id="extra-floors" value="4" min="1" oninput="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-center">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">تعداد واحد ساختمان</label>
                            <input type="number" id="extra-units" value="8" min="1" oninput="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-center">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">آسانسور دارد؟</label>
                            <select id="extra-elevator" onchange="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2">
                                <option value="دارد">بله، دارد</option>
                                <option value="ندارد">خیر، ندارد</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">پارکینگ دارد؟</label>
                            <select id="extra-parking" onchange="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2">
                                <option value="دارد">بله، دارد</option>
                                <option value="ندارد">خیر، ندارد</option>
                            </select>
                        </div>
                    </div>
                `;
                extraContainer.classList.remove('hidden');
            } else if (sub.hasHomeDetails) {
                extraContainer.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">مدت زمان نظافت</label>
                            <select id="extra-hours" onchange="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2">
                                <option value="4">۴ ساعت</option>
                                <option value="6">۶ ساعت</option>
                                <option value="8">۸ ساعت (یک روز کامل)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">نیاز به مواد شوینده؟</label>
                            <select id="extra-detergent" onchange="calculatePrice()" class="w-full bg-white border border-gray-300 rounded-lg p-2">
                                <option value="0">توسط خودم تهیه می‌شود</option>
                                <option value="150000">توسط متخصص آورده شود (+۱۵۰ ت)</option>
                            </select>
                        </div>
                    </div>
                `;
                extraContainer.classList.remove('hidden');
            } else {
                extraContainer.innerHTML = '';
            }

            calculatePrice();
            document.getElementById('order-form-details').classList.remove('hidden');
            document.getElementById('order-form-details').scrollIntoView({ behavior: 'smooth' });
        }

        function calculatePrice() {
            if (!currentSelectedService) return;
            let total = currentSelectedService.basePrice;

            if (currentSelectedService.hasStairDetails) {
                const floors = parseInt(document.getElementById('extra-floors').value) || 1;
                const units = parseInt(document.getElementById('extra-units').value) || 1;
                total = (floors * 50000) + (units * 15000) + 100000;
            } else if (currentSelectedService.hasHomeDetails) {
                const hours = parseInt(document.getElementById('extra-hours').value) || 4;
                const detergent = parseInt(document.getElementById('extra-detergent').value) || 0;
                total = (hours * currentSelectedService.basePrice) + detergent;
            }

            document.getElementById('estimated-price').innerText = total.toLocaleString() + ' تومان';
        }

        function closeBooking() {
            document.getElementById('booking-section').classList.add('hidden');
        }

        function switchTab(tabName) {
            if (tabName === 'services') {
                document.getElementById('tab-services').classList.remove('hidden');
                document.getElementById('tab-orders').classList.add('hidden');
                document.getElementById('nav-btn-services').className = "flex flex-col items-center text-indigo-600 text-xs font-bold gap-1";
                document.getElementById('nav-btn-orders').className = "flex flex-col items-center text-gray-400 text-xs font-medium gap-1";
            } else {
                document.getElementById('tab-services').classList.add('hidden');
                document.getElementById('tab-orders').classList.remove('hidden');
                document.getElementById('nav-btn-orders').className = "flex flex-col items-center text-indigo-600 text-xs font-bold gap-1";
                document.getElementById('nav-btn-services').className = "flex flex-col items-center text-gray-400 text-xs font-medium gap-1";
                loadOrders();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitOrder() {
            const date = document.getElementById('order-date').value;
            const time = document.getElementById('order-time').value;
            const phone = document.getElementById('order-phone').value;
            const address = document.getElementById('order-address').value;
            const finalPriceText = document.getElementById('estimated-price').innerText;

            if (!date || !phone || !address) {
                alert('لطفاً تاریخ شمسی، شماره تماس و آدرس را به طور کامل وارد کنید.');
                return;
            }

            let extraInfoText = '';
            if (document.getElementById('extra-floors')) {
                const floors = document.getElementById('extra-floors').value;
                const units = document.getElementById('extra-units').value;
                const elevator = document.getElementById('extra-elevator').value;
                const parking = document.getElementById('extra-parking').value;
                extraInfoText = `طبقات: ${floors} | واحدها: ${units} | آسانسور: ${elevator} | پارکینگ: ${parking}`;
            } else if (document.getElementById('extra-hours')) {
                const hours = document.getElementById('extra-hours').value;
                const detergent = document.getElementById('extra-detergent').value > 0 ? 'توسط متخصص' : 'توسط مشتری';
                extraInfoText = `مدت: ${hours} ساعت | شوینده: ${detergent}`;
            }

            const orderData = {
                id: 'ord_' + Date.now(),
                service_name: currentSelectedService.name,
                calculation_type: currentSelectedService.type,
                extra_details: extraInfoText,
                preferred_date: date,
                preferred_time: time,
                phone: phone,
                address: address,
                total_price: finalPriceText,
                status: 'در انتظار تایید و تخصیص متخصص',
                created_at: new Date().toISOString()
            };

            let orders = JSON.parse(localStorage.getItem('khedmat_orders') || '[]');
            orders.unshift(orderData);
            localStorage.setItem('khedmat_orders', JSON.stringify(orders));

            alert('سفارش شما با موفقیت ثبت شد!');
            closeBooking();
            switchTab('orders');
        }

        function cancelOrder(orderId) {
            if (confirm('آیا از لغو این سفارش اطمینان دارید؟')) {
                let orders = JSON.parse(localStorage.getItem('khedmat_orders') || '[]');
                orders = orders.filter(o => o.id !== orderId);
                localStorage.setItem('khedmat_orders', JSON.stringify(orders));
                loadOrders();
            }
        }

        function loadOrders() {
            const container = document.getElementById('orders-list-container');
            let orders = JSON.parse(localStorage.getItem('khedmat_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl shadow-sm border border-gray-100">
                        <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500 text-sm">هنوز سفارشی ثبت نکرده‌اید.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(ord => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">${ord.service_name}</h4>
                            <span class="text-xs text-indigo-600 font-medium">${ord.calculation_type}</span>
                        </div>
                        <span class="bg-amber-50 text-amber-700 text-xs px-2.5 py-1 rounded-full font-bold">${ord.status}</span>
                    </div>
                    <div class="text-xs text-gray-600 space-y-1 bg-gray-50 p-3 rounded-xl">
                        <div><i class="fa-regular fa-calendar ml-1 text-gray-400"></i> تاریخ: ${ord.preferred_date} (${ord.preferred_time})</div>
                        ${ord.extra_details ? `<div><i class="fa-solid fa-circle-info ml-1 text-gray-400"></i> جزئیات: ${ord.extra_details}</div>` : ''}
                        <div><i class="fa-solid fa-money-bill-wave ml-1 text-emerald-500"></i> مبلغ: <span class="font-bold text-emerald-600">${ord.total_price}</span></div>
                        <div><i class="fa-solid fa-location-dot ml-1 text-gray-400"></i> آدرس: ${ord.address}</div>
                        <div><i class="fa-solid fa-phone ml-1 text-gray-400"></i> تماس: ${ord.phone}</div>
                    </div>
                    <div class="flex justify-end pt-1 border-t">
                        <button onclick="cancelOrder('${ord.id}')" class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-100 transition">
                            <i class="fa-solid fa-trash-can ml-1"></i> لغو سفارش
                        </button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
