<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145c4b">
  <title>نامه‌یار | پیش‌نویس نامه</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f7f6;
      color: #172521;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.9;
    }

    .container {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    header { margin-bottom: 20px; }

    .brand {
      color: #145c4b;
      font-size: 25px;
      font-weight: bold;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #64716d;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #e3ebe7;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px #12351f0b;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #d5dfda;
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      font: inherit;
      color: inherit;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #28836b;
      box-shadow: 0 0 0 3px #28836b1c;
    }

    textarea {
      min-height: 125px;
      resize: vertical;
    }

    .hint {
      color: #71807a;
      font-size: 12px;
      margin-top: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      color: white;
      background: #145c4b;
    }

    .primary:hover { background: #0f493b; }

    .secondary {
      color: #145c4b;
      background: #eaf4f0;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .notice {
      background: #fff8e8;
      color: #6f541b;
      border: 1px solid #f0dfae;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      margin-top: 14px;
    }

    #resultCard { display: none; }

    #letter {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 220px;
      padding: 20px;
      background: #fff;
      border: 1px solid #e3e7e5;
      border-radius: 10px;
      font-size: 14px;
    }

    #status {
      min-height: 24px;
      color: #145c4b;
      font-size: 13px;
      margin-top: 6px;
    }

    @media (max-width: 540px) {
      .row { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }

    @media print {
      body { background: #fff; }
      header, #formCard, .result-title, .actions, .notice {
        display: none !important;
      }
      .container { width: 100%; padding: 0; }
      .card { border: 0; box-shadow: none; padding: 0; }
      #resultCard { display: block !important; }
      #letter {
        border: 0;
        padding: 0;
        font-size: 14pt;
        line-height: 2.1;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="brand">نامه‌یار</div>
      <p class="subtitle">توضیحت را بنویس؛ یک پیش‌نویس مرتب برای شروع بگیر.</p>
    </header>

    <section class="card" id="formCard">
      <div class="row">
        <div>
          <label for="recipient">مخاطب نامه</label>
          <input id="recipient" placeholder="مثلاً: ریاست محترم شهرداری منطقه">
        </div>

        <div>
          <label for="category">موضوع کلی</label>
          <select id="category">
            <option>درخواست</option>
            <option>پیگیری</option>
            <option>اعتراض</option>
            <option>شکایت</option>
            <option>موضوع دیگر</option>
          </select>
        </div>
      </div>

      <label for="subject">موضوع نامه</label>
      <input id="subject" placeholder="مثلاً: درخواست رسیدگی به جمع‌آوری زباله">

      <label for="details">ماجرا را به زبان خودت بنویس</label>
      <textarea id="details" placeholder="چه اتفاقی افتاده؟ از چه زمانی؟ چه چیزی می‌خواهی؟"></textarea>
      <div class="hint">لازم نیست رسمی بنویسی؛ فقط جزئیات درست را وارد کن.</div>

      <div class="actions">
        <button class="secondary" id="micButton" type="button">🎙️ گفتن با صدا</button>
      </div>
      <div id="status" aria-live="polite"></div>

      <label for="request">درخواست نهایی‌ات چیست؟</label>
      <textarea id="request" style="min-height:85px"
        placeholder="مثلاً: لطفاً موضوع بررسی و نتیجه به من اعلام شود."></textarea>

      <div class="row">
        <div>
          <label for="sender">نام و نام خانوادگی</label>
          <input id="sender" placeholder="اختیاری">
        </div>
        <div>
          <label for="tone">لحن نامه</label>
          <select id="tone">
            <option value="polite">محترمانه و معمولی</option>
            <option value="firm">محترمانه و قاطع</option>
          </select>
        </div>
      </div>

      <button class="primary" id="generateButton" type="button">
        ساخت پیش‌نویس نامه
      </button>

      <div class="notice">
        این نسخه نمونه است و متن را با قالب ساده می‌سازد. قبل از ارسال، اطلاعات و متن را بررسی کن.
      </div>
    </section>

    <section class="card" id="resultCard">
      <h2 class="result-title">پیش‌نویس نامه</h2>
      <div id="letter"></div>
      <div class="actions">
        <button class="secondary" id="copyButton" type="button">کپی متن</button>
        <button class="secondary" id="printButton" type="button">چاپ / ذخیره PDF</button>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $("generateButton").addEventListener("click", () => {
      const recipient = $("recipient").value.trim() || "مسئول محترم مربوطه";
      const subject = $("subject").value.trim();
      const details = $("details").value.trim();
      const request = $("request").value.trim();
      const sender = $("sender").value.trim();
      const tone = $("tone").value;

      if (!details) {
        $("status").textContent = "لطفاً اول ماجرا را در کادر توضیحات بنویس.";
        $("details").focus();
        return;
      }

      const date = new Intl.DateTimeFormat("fa-IR", {
        year: "numeric", month: "long", day: "numeric"
      }).format(new Date());

      const greeting = "با سلام و احترام،";

      const lines = [
        recipient,
        "",
        subject ? `موضوع: ${subject}` : `موضوع: ${$("category").value}`,
        "",
        greeting,
        "",
        `اینجانب، بدین‌وسیله به استحضار می‌رسانم: ${details}`,
        ""
      ];

      if (request) {
        lines.push(`خواهشمند است دستور فرمایید: ${request}`);
        lines.push("");
      }

      lines.push("پیشاپیش از توجه و رسیدگی شما سپاسگزارم.");
      lines.push("");
      lines.push("با احترام،");
      if (sender) lines.push(sender);
      lines.push(`تاریخ: ${date}`);
      lines.push("امضا:");

      $("letter").textContent = lines.join("\n");
      $("resultCard").style.display = "block";
      $("resultCard").scrollIntoView({ behavior: "smooth" });
      $("status").textContent = "";
    });

    $("copyButton").addEventListener("click", async () => {
      const text = $("letter").textContent;
      try {
        await navigator.clipboard.writeText(text);
        $("status").textContent = "متن نامه کپی شد.";
      } catch {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        $("status").textContent = "متن نامه کپی شد.";
      }
    });

    $("printButton").addEventListener("click", () => window.print());

    $("micButton").addEventListener("click", () => {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        $("status").textContent =
          "تشخیص گفتار در این مرورگر در دسترس نیست؛ می‌توانی از میکروفون صفحه‌کلید گوشی استفاده کنی.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "fa-IR";
      recognition.interimResults = false;
      recognition.onstart = () => $("status").textContent = "دارم گوش می‌دهم…";
      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        $("details").value += ($("details").value ? " " : "") + spokenText;
        $("status").textContent = "گفتار به متن اضافه شد.";
      };
      recognition.onerror = () =>
        $("status").textContent = "گرفتن صدا انجام نشد؛ اجازه میکروفون و اتصال مرورگر را بررسی کن.";
      recognition.start();
    });
  </script>
</body>
</html>
